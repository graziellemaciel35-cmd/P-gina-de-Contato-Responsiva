<!DOCTYPE html>
<html lang="pt-BR" dir="ltr">
  <head>
    <meta charset="UTF-8">
    <title> Responsive Contact Us Form  | CodingLab </title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css"/>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
   </head>
<body>
  <div class="container">
    <div class="content">
      <div class="left-side">
        <div class="address details">
          <i class="fas fa-map-marker-alt"></i>
          <div class="topic">Endereço</div>
          <div class="text-one">São Paulo</div>
          <div class="text-two">Brasil</div>
        </div>
        <div class="phone details">
          <i class="fas fa-phone-alt"></i>
          <div class="topic">Phone</div>
          <div class="text-one">55 11 99999-9999</div>
          <div class="text-two">55 11 00000-0000</div>
        </div>
        <div class="email details">
          <i class="fas fa-envelope"></i>
          <div class="topic">Email</div>
          <div class="text-one">Suporte@gmail.com</div>
          <div class="text-two">Contato@gmail.com</div>
        </div>
      </div>
      <div class="right-side">
        <div class="topic-text">Entre em contato </div>
        <p>Prencha o formulário  abaixo e entraremos em contato o mais rápido possível</p>
      <form action="#">
        <div class="input-box">
          <input type="text" placeholder="Digite seu nome">
        </div>
        <div class="input-box">
          <input type="text" placeholder="Digite seu email">
        </div>
        <div class="input-box message-box">
      <textarea placeholder="Digite sua mensagem" requerid></textarea>
        </div>
        <div class="button">
          <input type="button" value="Enviar mensagem" >
        </div>
      </form>
    </div>
    </div>
  </div>
</body>
</html
